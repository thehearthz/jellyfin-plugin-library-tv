name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/LibraryTV/LibraryTV.csproj -c Release
      - run: dotnet run --project tests/Planner.Tests -c Release
      - name: Install transport test tools
        # A slow package mirror must fail and retry rather than hang the job.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg; then exit 0; fi
            echo "Installing FFmpeg failed (attempt $attempt); retrying"
            sleep 15
          done
          exit 1
      - run: dotnet run --project tests/Integration.Tests -c Release
        env:
          LIBRARY_TV_FFMPEG: /usr/bin/ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: library-tv
          path: artifacts/*
