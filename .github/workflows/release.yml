name: Release
on:
  push:
    tags: ["v*"]
  # Release from GitHub's Actions page without a local clone; this run creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Four-part version, such as 0.5.0.0"
        required: true
      notes:
        description: "What changed (release notes and catalog changelog)"
        required: true
permissions:
  contents: write
concurrency:
  group: publish-catalog
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project tests/Planner.Tests -c Release
      - name: Install transport test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: dotnet run --project tests/Integration.Tests -c Release
        env:
          LIBRARY_TV_FFMPEG: /usr/bin/ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Create the release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Use a four-part version such as 0.5.0.0"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "$TAG already exists"; exit 1; fi
          if ! grep -q '[^[:space:]]' <<< "$NOTES"; then echo "Provide release notes"; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$NOTES"
          # Tags pushed with the workflow token do not start this workflow a second time.
          git push origin "refs/tags/$TAG"
      - name: Read release notes from the tag message
        run: |
          # Checkout can leave a lightweight copy of the tag; fetch the annotated tag itself.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then echo "Use an annotated tag: git tag -a $TAG -m 'What changed'"; exit 1; fi
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/changelog.txt"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changelog.txt"; then echo "The tag message is empty"; exit 1; fi
      - name: Package
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: ./scripts/package.ps1 -Version $env:TAG.Substring(1) -Repository $env:REPO -Changelog (Get-Content "$env:RUNNER_TEMP/changelog.txt" -Raw)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\nExperimental release for Jellyfin 12.2. Read the README for setup, codec constraints, and known limitations.\n' >> "$RUNNER_TEMP/changelog.txt"
          gh release create "$TAG" artifacts/* --title "Library TV $TAG (experimental)" --notes-file "$RUNNER_TEMP/changelog.txt"
      - name: Update install catalog
        shell: pwsh
        run: |
          $fresh = Get-Content artifacts/manifest.json -Raw | ConvertFrom-Json
          git checkout main
          if (Test-Path manifest.json) {
            $old = Get-Content manifest.json -Raw | ConvertFrom-Json
            $fresh[0].versions = @($fresh[0].versions) + @($old[0].versions | Where-Object { $_.version -ne $env:TAG.Substring(1) })
          }
          ConvertTo-Json -InputObject @($fresh) -Depth 20 | Set-Content manifest.json -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "Update plugin catalog for $env:TAG"
          git push origin main
